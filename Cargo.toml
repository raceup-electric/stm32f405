[workspace]
members = [
    "driver"
]

[dependencies]
driver = { path = "./driver" }  # Add dependency on the driver crate

[package]
name = "virtual_embassy_test"
version = "0.1.0"
edition = "2021"

[target.x86_64-unknown-linux-gnu.dependencies]
embassy-sync = "0.6.1"
embassy-executor = { version = "^0.6.3", features = ["arch-std", "executor-thread"] }
embassy-time = "0.3.2"
embassy-usb = "0.3.0"
embassy-futures = "0.1.1"
static_cell = "2.1.0"

[target.thumbv7em-none-eabihf.dependencies]
embassy-sync = { version = "^0.6.1", features = ["defmt"] }
embassy-executor = { version = "^0.6.3", features = ["task-arena-size-32768", "arch-cortex-m", "executor-thread", "executor-interrupt", "defmt", "integrated-timers"] }
embassy-time = { version = "^0.3.0", features = ["defmt", "defmt-timestamp-uptime", "tick-hz-32_768"] }
embassy-usb = { version = "^0.3.0", features = ["defmt" ] }
embassy-net = { version = "^0.5.0", features = ["defmt", "tcp", "dhcpv4", "medium-ethernet", ] }
embassy-net-wiznet = { version = "^0.1.0", features = ["defmt"] }
embassy-futures = "^0.1.0"

defmt = "^0.3"
defmt-rtt = "^0.4"

cortex-m = { version = "^0.7.6", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "^0.7.0"
panic-probe = { version = "^0.3", features = ["print-defmt"] }
embassy-stm32 = { version = "0.1.0", features = ["stm32f405rg"] }

[target.x86_64-unknown-linux-gnu.bin]
name = "main"
path = "supports/linux_main.rs"
test = false
doctest = false
bench = false

[target.thumbv7em-none-eabihf.bin]
name = "main"
path = "supports/stm_main.rs"

[profile.release]
debug = 2

[lib]
name = "logic_root"
path = "src/lib.rs"
