[package]
name = "bms_lv_rust"
version = "0.1.0"
edition = "2021"

[dependencies]
embassy-stm32 = { version = "^0.2.0", git = "https://github.com/embassy-rs/embassy.git", features = ["defmt", "stm32f405rg", "unstable-pac", "memory-x", "time-driver-tim4", "exti", "chrono", "low-power"] }
embassy-sync = { version = "^0.6.1", git = "https://github.com/embassy-rs/embassy.git", features = ["defmt"] }
embassy-executor = { version = "^0.7.0", git = "https://github.com/embassy-rs/embassy.git", features = ["arch-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-time = { version = "^0.4", git = "https://github.com/embassy-rs/embassy.git", features = ["defmt", "defmt-timestamp-uptime", "tick-hz-32_768"] }
embassy-usb = { version = "^0.4.0", git = "https://github.com/embassy-rs/embassy.git", features = ["defmt" ] }
embassy-net = { version = "^0.7.0", git = "https://github.com/embassy-rs/embassy.git", features = ["defmt", "tcp", "dhcpv4", "medium-ethernet", ] }
embassy-net-wiznet = { version = "^0.2.0", git = "https://github.com/embassy-rs/embassy.git", features = ["defmt"] }
embassy-futures = { version = "^0.1.0", git = "https://github.com/embassy-rs/embassy.git" }

defmt = "^1.0.1"
defmt-rtt = "^1.0"

cortex-m = { version = "^0.7.6", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "^0.7.0"
panic-probe = { version = "^1.0", features = ["print-defmt"] }

[profile.release]
debug = 2
